name: priceCheckTimed

on:
  schedule:
    - cron: '0 8 * * *'  # kjør hver 2. time
  workflow_dispatch:         # kan også kjøres manuelt

jobs:
  sjekk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Sett opp Java
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Bygg og kjør
        run: |
          mvn compile exec:java -Dexec.mainClass="Main" -X 2>&1 | tail -100
