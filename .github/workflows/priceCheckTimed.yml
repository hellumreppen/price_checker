name: priceCheckTimed

on:
  schedule:
    - cron: '0 8 * * *'  
  workflow_dispatch:         # kan også kjøres manuelt

jobs:
  sjekk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Sett opp Java
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: compile
        run: |
          mvn compile

      - name: package
        run: |
          mvn package

      - name: install
        run: |
          mvn clean install

      - name: kjør
        run: |
          mvn exec:java -Dexec.mainClass="oskar.projects.bot.price_checker.Main"
