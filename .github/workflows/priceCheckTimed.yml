name: priceCheckTimed

on:
  schedule:
    - cron: '0 8 * * *'  
  workflow_dispatch:         # kan også kjøres manuelt

jobs:
  sjekk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Sett opp Java
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - name: Bygg og kjør
        run: mvn clean install exec:java -Dexec.mainClass="oskar.projects.bot.price_checker.Main"
        
      - name: Send e-post
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-relay.brevo.com
          server_port: 465
          username: ${{ secrets.BREVO_USER }}
          password: ${{ secrets.BREVO_PASSWORD }}
          subject: "Prissjekk"
          to: oskar.hellum.reppen@gmail.com
          from: ozzy.dev@outlook.com
          body: file://src/main/resources/resultat.txt
