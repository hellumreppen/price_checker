name: priceCheckTimed

on:
  schedule:
    - cron: '0 8 * * *'  
  workflow_dispatch:         # kan også kjøres manuelt

jobs:
  sjekk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Sett opp Java
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - name: Bygg og kjør
        run: mvn clean install exec:java -Dexec.mainClass="oskar.projects.bot.price_checker.Main"
        
      - name: Send Discord-melding
        run: |
          MESSAGE=$(cat src/main/resources/resultat.txt)
          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"$MESSAGE\"}" \
               ${{ secrets.DISCORD_WEBHOOK }}
